# diagram.config.yaml: how your Blueprint Deck should be generated (made with the Blueprint Deck configurator).
# Put it in <your repo>/diagrams/ and ask your agent: "/blueprint-deck diagrams/diagram.config.yaml".
# Every key is explained in the kit's annotated template: plugins/blueprint-deck/skills/blueprint-deck/templates/diagram.config.yaml
version: 2

# ---------------------------------------------------------------- shared by every diagram in the file
project:
  name: "PID Tracker"
  subtitle: "App overview"
  maturity: partly-built
  one_liner: "PID Tracker is personal tracker of Prague transport commutes ... with schedule and route as bonus"

branding:
  website: "pid.cz"
  theme: midnight
  primary: ""
  secondary: ""
  shape: rounded
  logo: ""
  name_rules: []

sources:
  include:
    - "docs/**/*.md"
    - "README.md"
    - "src/**"
    - "services/**"
    - "apps/**"
    - "**/*.proto"
    - "**/openapi*.{yaml,yml,json}"
    - "docker-compose*.yml"
    - "k8s/**"
    - "kubernetes/**"
    - "helm/**"
    - "package.json"
    - "go.mod"
    - "pyproject.toml"
  exclude:
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*.test.*"
    - "**/*_test.go"
    - "**/test/**"
    - "**/tests/**"
  priority: []
  derive_status_from:
    - "k8s/"
    - "kubernetes/"
    - "helm/"
    - "docker-compose.yml"
  on_conflict: report
  cite_sources: true
  invent: never

behaviour:
  hero: true
  tour_position: auto
  zoom_to_focus: true
  edges_filter_by_view: true
  edge_labels: focus
  particles: main-flow
  overview_edges: all
  legend: collapsed
  editor: true
  credit: true
  keyboard: true

workflow:
  confirm_structure: true
  pause_after_extract: false
  output: "index.html"
  read_only_copy: false

