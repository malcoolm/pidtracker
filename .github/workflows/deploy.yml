name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    # Každé pondělí 03:30 UTC – PID GTFS platí jen 14 dní.
    - cron: "30 3 * * 1"
    # Sezónní ikona aplikace: zapnout 24. 10., vrátit 5. 11. (viz cargo xtask dist).
    - cron: "30 3 24 10 *"
    - cron: "30 3 5 11 *"
    # Vánoční ikona: sobota před 1. adventem připadá na 26. 11.–2. 12., proto se v těchto dnech
    # staví denně (build ikonu zapne, až období začne); vrátit 29. 12.
    - cron: "30 3 26-30 11 *"
    - cron: "30 3 1,2 12 *"
    - cron: "30 3 29 12 *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIDTRACKER_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Tests
        run: cargo test --workspace --exclude app --locked
      - name: Build dist
        run: cargo --locked xtask dist --public-url /${{ github.event.repository.name }}/ --fetch-gtfs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
